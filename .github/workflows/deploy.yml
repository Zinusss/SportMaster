name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SECRET_A: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          SECRET_B: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_C: ${{ secrets.CLIENT_ID }}
          VAR_A: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VAR_B: ${{ vars.GOOGLE_CLIENT_ID }}
          VAR_C: ${{ vars.CLIENT_ID }}
        run: |
          CLIENT_ID="${SECRET_A:-${SECRET_B:-${SECRET_C:-${VAR_A:-${VAR_B:-${VAR_C}}}}}}}"
          if [ -n "$CLIENT_ID" ]; then
            echo "✅ Google Client ID found, injecting into secrets.ts..."
            export VITE_GOOGLE_CLIENT_ID="$CLIENT_ID"
            echo "export const SECRETS = { googleClientId: '$CLIENT_ID' };" > src/config/secrets.ts
          else
            echo "⚠️ No Google Client ID found in secrets or vars!"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
